[project]
name = "kotaemon-asr-service"
version = "0.1.0"
description = "Standalone realtime FunASR and 3D-Speaker API for Kotaemon"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.112,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<2",
    "python-multipart>=0.0.12,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=11,<16",
]

[project.optional-dependencies]
funasr = [
    "funasr>=1.4.11,<2",
    "modelscope>=1.39.1,<2",
    "transformers>=4.40,<5",
    "cryptography==46.0.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba==0.58.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite==0.41.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.2,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio>=2.2,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
